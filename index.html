<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#243b53"><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>나의 물건 관리 - 4차</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#18232d;font-family:system-ui,"Noto Sans KR",sans-serif}header{background:#243b53;color:#fff;padding:17px 16px;position:sticky;top:0;z-index:3}h1{font-size:21px;margin:0}main{max-width:720px;margin:auto;padding:14px 14px 90px}button{border:0;border-radius:10px;padding:10px 12px;background:#e7edf2;color:#18232d;font-weight:600;font-size:14px}button.primary{background:#243b53;color:#fff}button.green{background:#e0f2e9;color:#17643d}button.danger{background:#fce8e6;color:#9b2921}input,textarea{width:100%;padding:11px;border:1px solid #ccd5de;border-radius:10px;font:inherit;background:#fff}.stats,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat,.tile,.item,.panel{background:#fff;border:1px solid #e0e5ea;border-radius:12px;padding:12px}.stat b{display:block;font-size:21px}.muted{font-size:12px;color:#687581;margin-top:4px}.tabs,.chips{display:flex;gap:7px;overflow:auto;margin:12px 0}.chip{border:1px solid #ccd5de;border-radius:20px;background:#fff;white-space:nowrap}.chip.sel{background:#243b53;color:#fff}.tile{text-align:left;min-height:85px}.tile .place-open{display:block;width:100%;text-align:left;background:transparent;padding:0}.order-controls{display:inline-flex;gap:4px;margin-left:auto}.order-controls button{padding:5px 9px;font-size:13px}.item{align-items:flex-start}.tile b{display:block;margin:5px 0}.item{display:flex;gap:9px;align-items:center;margin:8px 0}.thumb{width:62px;height:62px;object-fit:cover;border-radius:8px;background:#eee;flex-shrink:0}.info{flex:1;min-width:0}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.actions button{font-size:12px;padding:6px 9px}.hidden{display:none!important}.fab{position:fixed;right:18px;bottom:18px;border-radius:28px;padding:15px 20px;box-shadow:0 3px 15px #0002;z-index:2}.empty{text-align:center;color:#687581;padding:28px}.label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{width:20px;height:20px;flex-shrink:0}.bulkbar{position:sticky;bottom:76px;background:#fff;border:1px solid #d8e0e7;border-radius:12px;padding:10px;display:flex;gap:7px;align-items:center;box-shadow:0 3px 14px #0001}.bulkbar select{flex:1;min-width:0;padding:9px;border:1px solid #ccd5de;border-radius:8px;background:white}
</style></head><body>
<header><h1>나의 물건 관리</h1><small>내가 만든 장소와 분류로 물건을 쉽게 찾으세요</small></header>
<main>
<input id="search" placeholder="물건명 · 분류 · 보관장소 검색">
<div class="stats"><div class="stat"><b id="total">0</b><small>등록 항목</small></div><div class="stat"><b id="placesN">0</b><small>보관장소</small></div><div class="stat"><b id="qtyN">0</b><small>총 수량</small></div></div>
<div class="tabs"><button data-view="items" class="primary">물품 목록</button><button data-view="places">보관장소</button><button data-view="cats">물품 분류</button></div>
<section id="items"><div id="filters" class="chips"></div><div style="display:flex;gap:7px;align-items:center;margin:8px 0"><button id="selectAll">현재 목록 전체 선택</button><button id="clearSelection">선택 해제</button><span class="muted" id="selectedCount">선택 0개</span></div><div id="list"></div><div id="bulkbar" class="bulkbar hidden"><select id="bulkPlace"></select><button class="green" id="bulkMove">선택 물품 이동</button></div></section>
<section id="places" class="hidden"><p class="muted">장소를 누르면 그곳에 보관된 물건을 확인하고, 장소 이름도 관리할 수 있습니다.</p><button class="primary" id="newPlace">＋ 장소 추가</button><div id="placeGrid" class="grid"></div></section>
<section id="cats" class="hidden"><button class="primary" id="newCat">＋ 분류 추가</button><div id="catList"></div></section>
<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:16px"><button class="green" id="xlsx">엑셀(.xlsx) 내보내기</button><button id="backup">JSON 백업</button><button id="restoreBtn">백업 복원</button><input id="restore" type="file" accept=".json" class="hidden"></div>
<p class="muted">데이터는 이 휴대폰 브라우저에 저장됩니다. 정기적으로 백업해 주세요.</p></main>
<button id="add" class="primary fab">＋ 물건 등록</button>
<div id="form" class="hidden" style="position:fixed;inset:0;overflow:auto;background:#f3f5f7;z-index:4"><header><h1 id="formTitle">물건 등록</h1></header><main><div class="panel">
<label class="label">물품명 *</label><input id="name" placeholder="예: 검정색 겨울 코트">
<label class="label">분류 선택</label><div id="catChoices" class="chips"></div>
<label class="label">사진 첨부 (선택)</label><input id="photo" type="file" accept="image/*"><small class="muted">휴대폰 갤러리 또는 파일에서 기존 사진을 선택할 수 있습니다.</small><img id="preview" class="hidden" style="max-width:100%;max-height:180px;margin-top:8px">
<label class="label">보관장소 선택 *</label><div id="placeChoices" class="chips"></div>
<label class="label">세부 위치 (선택)</label><input id="detail" placeholder="예: 왼쪽 두 번째 서랍">
<div class="row"><div><label class="label">수량</label><input id="quantity" type="number" min="1" value="1"></div><div><label class="label">상세 종류</label><input id="kind" placeholder="예: 겨울 코트"></div></div>
<label class="label">메모</label><textarea id="memo" rows="3"></textarea>
<div style="display:flex;gap:8px;margin-top:15px"><button id="cancel">취소</button><button class="primary" id="save" style="flex:1">저장</button></div></div></main></div>
<div id="placeModal" class="hidden" style="position:fixed;inset:0;overflow:auto;background:#f3f5f7;z-index:5"><header><button id="closePlace" style="float:right">닫기</button><h1 id="placeTitle">장소</h1><small>이 장소에 보관된 물건</small></header><main><div id="placeContents"></div><button id="renamePlace">장소 이름 변경</button> <button class="danger" id="deletePlace">장소 삭제</button></main></div>
<script>
const KEY='mythings-v3';let d;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(!d){let old=[];try{old=JSON.parse(localStorage.getItem('mythings-v3')||'[]')}catch(e){}d={places:['안방','거실','주방','서재','베란다','현관','차량','기타'],cats:['의류','개인 소품','생활용품','전자제품','취미·운동','기타'],items:Array.isArray(old)?old:[]}}
d.places=d.places||['안방','거실','주방','서재','베란다','현관','차량','기타'];d.cats=d.cats||['의류','개인 소품','생활용품','전자제품','취미·운동','기타'];d.items=d.items||[];
let view='items',filter='전체',editing=null,photoData='',activePlace='',selected=new Set();
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(KEY,JSON.stringify(d));render()}
function card(x,withCheck=false){return `<article class="item">${withCheck?`<input class="check" type="checkbox" data-check="${esc(x.id)}" ${selected.has(x.id)?'checked':''}>`:''}<img class="thumb" src="${x.photo||''}" style="${x.photo?'':'visibility:hidden'}"><div class="info"><b>${esc(x.name)}</b><div class="muted">${esc(x.cat||'미분류')} · 수량 ${Number(x.qty)||1}</div><div class="muted">📍 ${esc(x.place||'위치 미지정')}${x.detail?' → '+esc(x.detail):''}</div><div class="actions"><button data-edit="${esc(x.id)}">수정</button><button data-move="${esc(x.id)}">보관장소 변경</button><button class="danger" data-del="${esc(x.id)}">삭제</button><span class="order-controls"><button title="위로 이동" data-order-item="${esc(x.id)}" data-dir="-1">↑</button><button title="아래로 이동" data-order-item="${esc(x.id)}" data-dir="1">↓</button></span></div></div></article>`}
function render(){ $('total').textContent=d.items.length;$('placesN').textContent=d.places.length;$('qtyN').textContent=d.items.reduce((a,x)=>a+(+x.qty||1),0);
$('filters').innerHTML=['전체',...d.cats].map(c=>`<button class="chip ${filter===c?'sel':''}" data-filter="${esc(c)}">${esc(c)}</button>`).join('');
let q=$('search').value.toLowerCase(),a=d.items.filter(x=>(filter==='전체'||x.cat===filter)&&[x.name,x.cat,x.kind,x.place,x.detail,x.memo].join(' ').toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(x=>card(x,true)).join(''):'<div class="empty">등록된 물건이 없습니다.</div>';
$('placeGrid').innerHTML=d.places.map((p,i)=>`<div class="tile"><button class="place-open" data-place="${esc(p)}">📦<b>${esc(p)}</b><small>${d.items.filter(x=>x.place===p).length}개 보관</small></button><div class="order-controls"><button title="장소 위로 이동" data-order-place="${esc(p)}" data-dir="-1" ${i===0?'disabled':''}>↑</button><button title="장소 아래로 이동" data-order-place="${esc(p)}" data-dir="1" ${i===d.places.length-1?'disabled':''}>↓</button></div></div>`).join('');
$('catList').innerHTML=d.cats.map(c=>`<div class="item"><div class="info"><b>${esc(c)}</b><div class="muted">${d.items.filter(x=>x.cat===c).length}개</div></div><button data-renamecat="${esc(c)}">수정</button><button class="danger" data-delcat="${esc(c)}">삭제</button></div>`).join('');
$('selectedCount').textContent='선택 '+selected.size+'개';$('bulkbar').classList.toggle('hidden',selected.size===0);$('bulkPlace').innerHTML=d.places.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}
function switchView(v){view=v;['items','places','cats'].forEach(k=>$(k).classList.toggle('hidden',k!==v));$('add').classList.toggle('hidden',v!=='items');render()}
document.querySelector('.tabs').onclick=e=>{let v=e.target.dataset.view;if(v)switchView(v)};
$('search').oninput=render;$('filters').onclick=e=>{if(e.target.dataset.filter){filter=e.target.dataset.filter;selected.clear();render()}};
function openForm(id){editing=id;let x=id?d.items.find(z=>z.id===id):{};photoData=x.photo||'';$('formTitle').textContent=id?'물품 수정':'물건 등록';$('name').value=x.name||'';$('quantity').value=x.qty||1;$('kind').value=x.kind||'';$('detail').value=x.detail||'';$('memo').value=x.memo||'';$('photo').value='';$('preview').src=photoData;$('preview').classList.toggle('hidden',!photoData);
$('catChoices').innerHTML=d.cats.map(c=>`<button class="chip ${c===(x.cat||d.cats[0])?'sel':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
$('placeChoices').innerHTML=d.places.map(p=>`<button class="chip ${p===(x.place||activePlace||d.places[0])?'sel':''}" data-p="${esc(p)}">${esc(p)}</button>`).join('');$('form').classList.remove('hidden')}
function moveItem(id){let x=d.items.find(z=>z.id===id);if(!x)return;let choice=prompt('새 보관장소를 선택하세요.\\n'+d.places.map((p,i)=>(i+1)+'. '+p).join('\\n')+'\\n\\n번호를 입력하세요.');if(choice===null)return;let n=Number(choice);if(!Number.isInteger(n)||n<1||n>d.places.length)return alert('올바른 장소 번호를 입력해 주세요.');x.place=d.places[n-1];persist();if(activePlace)showPlace(activePlace)}
$('add').onclick=()=>openForm();$('cancel').onclick=()=>$('form').classList.add('hidden');
$('catChoices').onclick=e=>{if(e.target.dataset.c){document.querySelectorAll('#catChoices button').forEach(b=>b.classList.remove('sel'));e.target.classList.add('sel')}};
$('placeChoices').onclick=e=>{if(e.target.dataset.p){document.querySelectorAll('#placeChoices button').forEach(b=>b.classList.remove('sel'));e.target.classList.add('sel')}};
$('photo').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('이미지 파일을 선택해 주세요.');e.target.value='';return}try{let data;if(window.createImageBitmap){const bitmap=await createImageBitmap(f);const max=1600,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();data=canvas.toDataURL('image/jpeg',0.82)}else{data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.82))};img.src=reader.result};reader.readAsDataURL(f)})}photoData=data;$('preview').src=photoData;$('preview').classList.remove('hidden')}catch(err){alert('사진을 읽지 못했습니다. JPG 또는 PNG 사진을 선택해 주세요.')}e.target.value=''};
$('save').onclick=()=>{let name=$('name').value.trim(),cat=document.querySelector('#catChoices .sel')?.dataset.c,place=document.querySelector('#placeChoices .sel')?.dataset.p;if(!name||!place){alert('물품명과 보관장소를 입력·선택해 주세요.');return}let old=editing?d.items.find(x=>x.id===editing):{};let x={...old,id:editing||String(Date.now()),name,cat,place,detail:$('detail').value.trim(),qty:Math.max(1,+$('quantity').value||1),kind:$('kind').value.trim(),memo:$('memo').value.trim(),photo:photoData};if(editing)d.items=d.items.map(y=>y.id===editing?x:y);else d.items.unshift(x);persist();$('form').classList.add('hidden');if(activePlace)showPlace(activePlace)};
function reorderItem(id,dir,placeOnly=false){let visible=placeOnly?d.items.filter(x=>x.place===activePlace):d.items.filter(x=>(filter==='전체'||x.cat===filter)&&[x.name,x.cat,x.kind,x.place,x.detail,x.memo].join(' ').toLowerCase().includes($('search').value.toLowerCase()));let at=visible.findIndex(x=>x.id===id),to=at+dir;if(at<0||to<0||to>=visible.length)return;let a=d.items.indexOf(visible[at]),b=d.items.indexOf(visible[to]);[d.items[a],d.items[b]]=[d.items[b],d.items[a]];persist();if(placeOnly)showPlace(activePlace)}
function reorderPlace(p,dir){let i=d.places.indexOf(p),j=i+dir;if(i<0||j<0||j>=d.places.length)return;[d.places[i],d.places[j]]=[d.places[j],d.places[i]];persist()}
$('list').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.orderItem){reorderItem(b.dataset.orderItem,+b.dataset.dir);return}if(b.dataset.edit)openForm(b.dataset.edit);if(b.dataset.move)moveItem(b.dataset.move);if(b.dataset.del&&confirm('삭제할까요?')){d.items=d.items.filter(x=>x.id!==b.dataset.del);selected.delete(b.dataset.del);persist()}};
$('list').onchange=e=>{if(e.target.dataset.check){let id=e.target.dataset.check;e.target.checked?selected.add(id):selected.delete(id);render()}};
$('selectAll').onclick=()=>{let q=$('search').value.toLowerCase();d.items.filter(x=>(filter==='전체'||x.cat===filter)&&[x.name,x.cat,x.kind,x.place,x.detail,x.memo].join(' ').toLowerCase().includes(q)).forEach(x=>selected.add(x.id));render()};
$('clearSelection').onclick=()=>{selected.clear();render()};
$('bulkMove').onclick=()=>{let p=$('bulkPlace').value;if(!selected.size||!p)return;if(!confirm('선택한 '+selected.size+'개 물품을 "'+p+'"로 이동할까요?'))return;d.items.forEach(x=>{if(selected.has(x.id))x.place=p});selected.clear();persist();alert('선택한 물품을 이동했습니다.')};
$('newPlace').onclick=()=>{let p=prompt('새 보관장소 이름');if(p?.trim()){p=p.trim();if(d.places.includes(p))return alert('이미 있는 장소입니다.');d.places.push(p);persist()}};
$('placeGrid').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.orderPlace){reorderPlace(b.dataset.orderPlace,+b.dataset.dir);return}let p=b.dataset.place;if(p)showPlace(p)};
function showPlace(p){activePlace=p;$('placeTitle').textContent=p;let a=d.items.filter(x=>x.place===p);$('placeContents').innerHTML=a.length?a.map(x=>card(x,false)).join(''):'<div class="empty">이 장소에는 아직 물건이 없습니다.</div>';$('placeModal').classList.remove('hidden')}
$('closePlace').onclick=()=>$('placeModal').classList.add('hidden');
$('placeContents').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.orderItem){reorderItem(b.dataset.orderItem,+b.dataset.dir,true);return}if(b.dataset.edit){$('placeModal').classList.add('hidden');openForm(b.dataset.edit)}if(b.dataset.move)moveItem(b.dataset.move);if(b.dataset.del&&confirm('삭제할까요?')){d.items=d.items.filter(x=>x.id!==b.dataset.del);persist();showPlace(activePlace)}};
$('renamePlace').onclick=()=>{let n=prompt('새 장소 이름',activePlace);if(!n?.trim())return;n=n.trim();if(d.places.includes(n))return alert('이미 있는 장소입니다.');d.places=d.places.map(p=>p===activePlace?n:p);d.items.forEach(x=>{if(x.place===activePlace)x.place=n});activePlace=n;persist();showPlace(n)};
$('deletePlace').onclick=()=>{if(d.items.some(x=>x.place===activePlace))return alert('물품이 남아 있습니다. 먼저 물품을 다른 장소로 옮겨 주세요.');if(confirm('장소를 삭제할까요?')){d.places=d.places.filter(x=>x!==activePlace);persist();$('placeModal').classList.add('hidden')}};
$('newCat').onclick=()=>{let c=prompt('새 물품 분류 이름');if(c?.trim()){c=c.trim();if(d.cats.includes(c))return alert('이미 있는 분류입니다.');d.cats.push(c);persist()}};
$('catList').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.renamecat){let o=b.dataset.renamecat,n=prompt('새 분류 이름',o);if(!n?.trim())return;n=n.trim();if(d.cats.includes(n))return alert('이미 있는 분류입니다.');d.cats=d.cats.map(c=>c===o?n:c);d.items.forEach(x=>{if(x.cat===o)x.cat=n});if(filter===o)filter=n;persist()}if(b.dataset.delcat){let c=b.dataset.delcat;if(d.items.some(x=>x.cat===c))return alert('이 분류의 물품을 먼저 다른 분류로 변경하세요.');if(confirm('분류를 삭제할까요?')){d.cats=d.cats.filter(x=>x!==c);if(filter===c)filter='전체';persist()}}};
function dl(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('backup').onclick=()=>dl(new Blob([JSON.stringify(d)],{type:'application/json'}),'물건관리_백업.json');
$('restoreBtn').onclick=()=>$('restore').click();$('restore').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let z=JSON.parse(r.result);if(!Array.isArray(z.items)||!Array.isArray(z.places)||!Array.isArray(z.cats))throw 0;if(confirm('현재 데이터를 백업 내용으로 교체할까요?')){d=z;selected.clear();persist()}}catch{alert('백업 파일을 확인해 주세요.')}};r.readAsText(f)};
$('xlsx').onclick=()=>{if(!d.items.length)return alert('내보낼 물품이 없습니다.');if(!window.XLSX)return alert('엑셀 기능을 불러오지 못했습니다. 인터넷 연결 후 다시 시도하세요.');let w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(d.items.map(x=>({'물품명':x.name,'분류':x.cat,'상세종류':x.kind,'보관장소':x.place,'세부위치':x.detail,'수량':x.qty,'메모':x.memo,'사진등록':x.photo?'있음':'없음'}))),'물품목록');XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(d.places.map(p=>({'보관장소':p,'물품수':d.items.filter(x=>x.place===p).length,'물품목록':d.items.filter(x=>x.place===p).map(x=>x.name+'('+x.qty+')').join(', ')}))),'장소별목록');XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(d.cats.map(c=>({'분류':c,'물품수':d.items.filter(x=>x.cat===c).length,'물품목록':d.items.filter(x=>x.cat===c).map(x=>x.name).join(', ')}))),'분류별목록');XLSX.writeFile(w,'나의_물건관리.xlsx')};
render();
</script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('PWA 등록 실패:', err));

}
